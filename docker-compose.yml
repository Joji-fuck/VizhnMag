version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    volumes:
      - .:/var/www
    depends_on:
      - postgres
    networks:
      - laravel
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - laravel
  node:
    image: node:20-alpine
    container_name: laravel_node
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - laravel
  postgres:
      image: postgres:14
      container_name: postgres
      restart: always
      environment:
        POSTGRES_DB: vizhn
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: admin
      ports:
        -   "5432:5432"
      volumes:
        -   pgdata:/var/lib/postgresql/data
      networks:
        - laravel
  pgadmin:
      image: dpage/pgadmin4
      container_name: pgadmin
      restart: always
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@mail.ru
        PGADMIN_DEFAULT_PASSWORD: admin
      ports:
        -   "5050:80"
      depends_on:
        -   postgres
      networks:
        - laravel

volumes:
  pgdata:

networks:
  laravel:
    driver: bridge

